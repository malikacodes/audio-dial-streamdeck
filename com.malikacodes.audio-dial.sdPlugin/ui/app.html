<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Elgato's settings components, same as devices.html. -->
    <script src="sdpi-components.js"></script>
    <style>
      sdpi-color {
        display: block;
        width: 36px;
      }
    </style>
  </head>
  <body>
    <!-- The list is the apps that are open right now, so open the app
         first if it's missing. The plugin answers "getApps". -->
    <sdpi-item label="App">
      <sdpi-select setting="app" datasource="getApps" hot-reload loading="Loading apps…" placeholder="Pick an app"></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Step size">
      <sdpi-select setting="step" default="3">
        <option value="1">1%</option>
        <option value="2">2%</option>
        <option value="3">3%</option>
        <option value="5">5%</option>
        <option value="10">10%</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Volume color">
      <sdpi-color setting="volumeColor" default="#f2a7c3"></sdpi-color>
    </sdpi-item>
  </body>
</html>
